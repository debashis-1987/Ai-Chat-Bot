name: Android Instrumented Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Report instrumented failures
        if: failure()
        run: |
          reports="app/build/outputs/androidTest-results/connected/debug"
          if ls "$reports"/*.xml >/dev/null 2>&1; then
            summary=$(grep -h -A2 '<failure' "$reports"/*.xml | head -n 6 | tr '\n' ' ' | cut -c1-900)
            summary=${summary//'%'/'%25'}
            echo "::error title=Instrumented tests failed::$summary"
          else
            echo "::error title=Instrumented tests failed::No test result XML was produced (build or emulator failure)."
          fi
